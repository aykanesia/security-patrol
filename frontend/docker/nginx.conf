# ============================================================
# Nginx — Security Patrol (di dalam image frontend)
# - SPA Vue (static) dari /usr/share/nginx/html
# - /api/*  → PHP-FPM Laravel di service `backend` (port 9000)
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10M;

    # ---------- API Laravel (semua rute lewat public/index.php) ----------
    location /api/ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass backend:9000;
        fastcgi_read_timeout 60s;
    }

    # health check Laravel (/up)
    location = /up {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass backend:9000;
    }

    # ---------- Blokir file sensitif/tersembunyi ----------
    location ~ /\. { deny all; }
    location ~ \.(env|log|bak|sql|ini|sh|py|php|phtml)$ { deny all; }

    # ---------- SPA Vue ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # asset ber-hash vite (index-xxxx.js/css) cache lama
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
